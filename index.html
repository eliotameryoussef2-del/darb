<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0c0e11"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Darb"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" type="image/svg+xml" href="icon.svg"><link rel="icon" type="image/png" sizes="192x192" href="icon-192.png"><link rel="apple-touch-icon" href="icon-180.png"><style>body{margin:0}[hidden]{display:none!important}</style></head><body>
<title>Darb</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Syne:wght@600;800&family=Figtree:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: phone-width app shell; full-screen vertical swipe feed + list tabs; road-marking yellow accent ("darb" = path) */
:root{
  --ink:#0c0e11; --panel:#15181d; --panel2:#1d2128; --line:#2a2f38;
  --fg:#f2f0ea; --mute:#9ea4ae; --accent:#ffd23f; --accent-ink:#1a1500;
  --ok:#4fd18b; --warn:#ffb547; --bad:#ff6b6b; --info:#7fb4ff;
  --display:"Syne","Arial Black",system-ui,sans-serif;
  --body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Consolas,monospace;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--ink);color:var(--fg);font-family:var(--body);font-size:15px;overflow:hidden}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#app{position:relative;max-width:460px;height:100%;margin:0 auto;display:grid;grid-template-rows:minmax(0,1fr) auto;background:var(--ink);overflow:hidden;border-left:1px solid var(--line);border-right:1px solid var(--line)}
main{position:relative;min-height:0}
.view{position:absolute;inset:0;overflow-y:auto}
.pad{padding:16px max(16px,env(safe-area-inset-right,0px)) 24px max(16px,env(safe-area-inset-left,0px))}

/* Feed */
.feed{scroll-snap-type:y mandatory;overscroll-behavior:contain}
.slide{position:relative;height:100%;scroll-snap-align:start;scroll-snap-stop:always;overflow:hidden;background:var(--panel)}
.art{position:absolute;inset:0 0 34% 0}
.art svg{width:100%;height:100%;display:block}
.art .photo{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;max-width:none}
.art .photo.contain{object-fit:contain;padding:18% 12% 22%;box-sizing:border-box;background:#f4f2ee}
/* Banners, wordmarks and tiny thumbnails are shown whole on white instead of being cropped. */
.art .photo.fit,.gal img.fit{object-fit:contain;background:#fff;padding:10% 7% 30%;box-sizing:border-box}
.thumb .photo.fit{object-fit:contain;background:#fff;padding:6%}
.art video.photo{background:#000}
.snd{position:absolute;top:calc(env(safe-area-inset-top) + 92px);left:12px;z-index:3;border:0;border-radius:99px;background:rgba(0,0,0,.55);color:#fff;font-size:13px;padding:7px 11px}
.chip.ended{background:#3a3a3a;color:#ddd}
.reg-btn.ended{background:#2a2a2a;color:#eee;border:1px solid #555}
.minirow{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.cgroup{display:flex;align-items:center;justify-content:space-between;gap:10px}
.mypost{display:flex;justify-content:space-between;align-items:center;gap:10px;border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:8px}
.mypost small{display:block;color:var(--mute);font-size:12.5px}
.seg{display:flex;gap:6px;margin:6px 0 14px}.seg .fchip{flex:1;text-align:center}
.mediagrid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:8px 0}
.mediagrid>div{position:relative;aspect-ratio:1;border-radius:10px;overflow:hidden;background:#222}
.mediagrid img,.mediagrid video{width:100%;height:100%;object-fit:cover}
.mediagrid button{position:absolute;top:4px;right:4px;border:0;border-radius:99px;background:rgba(0,0,0,.7);color:#fff;width:24px;height:24px}
.clink{background:none;border:0;color:var(--mute);font-size:12.5px;padding:2px 0;font-weight:600}
.cm.reply{margin-left:22px;border-left:2px solid var(--line);padding-left:10px}
.tab.dot,.fchip.dot{position:relative}.tab.dot::after,.fchip.dot::after{content:"";position:absolute;top:6px;right:calc(50% - 16px);width:9px;height:9px;border-radius:50%;background:#ff3b30;border:2px solid var(--bg)}.fchip.dot::after{top:-2px;right:-2px}
.stiles{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.stile{border:1px solid var(--line);border-radius:12px;padding:10px 12px}.stile b{display:block;font-size:22px}.stile small{color:var(--mute);font-size:12px}
.bars{display:flex;align-items:flex-end;gap:3px;height:110px;margin-top:8px}.bars>div{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%}.bars i{display:block;width:100%;background:var(--accent);border-radius:3px 3px 0 0;min-height:2px}.bars small{font-size:9px;color:var(--mute)}
html[dir=rtl] .cat,html[dir=rtl] .h1,html[dir=rtl] .lbl,html[dir=rtl] .flabel,html[dir=rtl] .sec h3{letter-spacing:0;font-family:"Noto Sans Arabic","Segoe UI",Tahoma,sans-serif;text-transform:none}
.langrow{display:flex;align-items:center;gap:8px;margin:0 0 10px;font-size:14px}
html[dir=rtl] body{font-family:"Noto Sans Arabic","Segoe UI",Tahoma,var(--body)}
html[dir=rtl] .cm.reply{margin-left:0;margin-right:22px;border-left:0;border-right:2px solid var(--line);padding-left:0;padding-right:10px}
html[dir=rtl] .title,html[dir=rtl] .nt{direction:ltr;unicode-bidi:plaintext;text-align:right}
.badge-org{display:inline-block;font-size:11.5px;font-weight:700;background:#1d4d2e;color:#9ff0b8;border-radius:6px;padding:2px 7px;margin-left:6px}
.logo{width:26px;height:26px;border-radius:7px;object-fit:contain;background:#fff;flex:none;vertical-align:middle;margin-right:7px}
.thumb{position:relative}
.thumb .photo{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.thumb .logotile{inset:8px;padding:4px;border-radius:6px}
.art .base.soft{filter:blur(14px) saturate(1.2);transform:scale(1.15)}
.logotile{position:absolute;inset:13% 27% 42%;background:#fff;border-radius:22px;display:grid;place-items:center;padding:22px;box-shadow:0 12px 40px rgba(0,0,0,.35)}
.logotile.inline{position:static;width:96px;height:96px;padding:12px;border-radius:20px;box-sizing:border-box;box-shadow:0 8px 28px rgba(0,0,0,.4)}
.logotile img{max-width:100%;max-height:100%;object-fit:contain}
/* category-tinted fade: the picture stays bright on top, text sits on the category colour below */
.shade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(12,14,17,.6) 0%,rgba(12,14,17,0) 14%,rgba(12,14,17,0) 26%,rgba(12,14,17,.7) 42%,rgba(12,14,17,.95) 58%,var(--ink) 70%)}
.info .title,.info .org{text-shadow:0 1px 12px rgba(0,0,0,.6)}
.ph-tag{position:absolute;top:60px;left:16px;font:500 10px/1 var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--fg);background:rgba(12,14,17,.55);padding:5px 7px;border-radius:4px}
.sample-tag{position:absolute;top:60px;right:16px;font:700 11px/1 var(--body);letter-spacing:.05em;text-transform:uppercase;background:var(--warn);color:#201300;padding:6px 8px;border-radius:4px}
.info{position:absolute;left:0;right:66px;bottom:0;padding:0 0 18px 16px;display:flex;flex-direction:column;gap:8px}
.cat{align-self:flex-start;font:500 11px/1 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--accent-ink);background:var(--accent);padding:5px 8px;border-radius:3px}
.title{font:800 25px/1.08 var(--display);text-wrap:balance;margin:0;letter-spacing:-.01em;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.org{color:var(--mute);font-size:13.5px;margin-top:-2px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:12.5px;font-weight:600;padding:5px 9px;border-radius:999px;background:var(--panel2);border:1px solid var(--line);white-space:nowrap}
.chip.hot{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.chip.ok{border-color:rgba(79,209,139,.5);color:var(--ok)}
.chip.warn{border-color:rgba(255,181,71,.5);color:var(--warn)}
.chip.bad{border-color:rgba(255,107,107,.5);color:var(--bad)}
.why{font-size:12.5px;color:var(--mute)}
.why b{color:var(--fg);font-weight:600}
.details-btn{align-self:flex-start;margin-top:2px;background:var(--fg);color:var(--ink);border:0;border-radius:999px;padding:9px 16px;font-weight:700;font-size:14px}
.rail{position:absolute;right:8px;bottom:22px;display:flex;flex-direction:column;gap:14px;align-items:center}
.rb{display:flex;flex-direction:column;align-items:center;gap:4px;background:none;border:0;padding:0;width:52px;font-size:11px;color:var(--fg)}
.rb .ic{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:rgba(29,33,40,.85);border:1px solid var(--line)}
.rb.on .ic{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.rb svg{width:22px;height:22px}
.topbar{position:absolute;top:0;left:0;right:0;z-index:5;display:flex;gap:4px;justify-content:center;padding:12px 8px 8px;background:linear-gradient(180deg,rgba(12,14,17,.85),rgba(12,14,17,0))}
.tb{background:none;border:0;padding:6px 8px;font-weight:600;font-size:13.5px;white-space:nowrap;color:var(--mute);border-bottom:2px solid transparent}
.tb.on{color:var(--fg);border-color:var(--accent)}
#feedbar{flex-direction:column;align-items:stretch;gap:6px;padding:10px 0 14px}
.tabsrow{display:flex;gap:2px;justify-content:center}
.topicrow{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:0 12px}
.topicrow::-webkit-scrollbar{display:none}
.tchip{flex:none;font-size:12.5px;font-weight:600;padding:5px 11px;border-radius:999px;background:rgba(29,33,40,.85);border:1px solid var(--line);color:var(--fg)}
.tchip.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.ph-tag,.sample-tag{top:60px!important}
.feed.withtopics .ph-tag{top:96px!important}
/* optional colourful card style (Me → Colourful cards) */
.colorful .slide{background:var(--cb,var(--panel))}
.colorful .art{inset:0 0 26% 0}
.colorful .shade{background:linear-gradient(180deg,rgba(0,0,0,.42) 0%,rgba(0,0,0,0) 14%,rgba(0,0,0,0) 36%,color-mix(in srgb,var(--cb) 75%,transparent) 52%,var(--cb) 70%)}
.colorful .cat{color:#10121a;background:var(--cc)}
.fit{display:flex;flex-direction:column;gap:5px;font-size:14px}
.fit .g{color:var(--ok)}.fit .w{color:var(--warn)}.fit .b{color:var(--bad)}
/* TikTok-style tab row with refresh (left) and filters (right) */
.tabsrow{position:relative;padding:0 46px}
.tbx{position:absolute;top:0;width:36px;height:34px;display:grid;place-items:center;background:none;border:0;color:var(--fg);padding:0}
.tbx svg{width:22px;height:22px}
.tbx.left{left:6px}.tbx.right{right:6px}
.tbx b{position:absolute;top:0;right:0;min-width:16px;height:16px;border-radius:8px;background:var(--accent);color:var(--accent-ink);font:700 10px/16px var(--body)}
.tbx.on{color:var(--accent)}
/* photos: swipe sideways */
.shade,.ph-tag{pointer-events:none}
.gal{position:absolute;inset:0;display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;overscroll-behavior-x:contain}
.gal::-webkit-scrollbar{display:none}
.gal img{flex:0 0 100%;width:100%;height:100%;object-fit:cover;scroll-snap-align:center;max-width:none}
.dots{position:absolute;left:0;right:0;top:calc(66% - 46px);display:flex;justify-content:center;gap:5px;z-index:3;pointer-events:none}
.dots i{width:6px;height:6px;border-radius:50%;background:rgba(255,255,255,.45)}
.dots i.on{background:#fff;width:16px;border-radius:3px}
/* organiser line on cards and sheets */
.orgbtn{display:flex;align-items:center;gap:0;background:none;border:0;padding:0;color:var(--mute);font-size:13.5px;text-align:left;cursor:pointer;max-width:100%}
.orgbtn span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fol{font-style:normal;font-size:11.5px;font-weight:700;margin-left:8px;padding:2px 7px;border-radius:999px;border:1px solid var(--line);color:var(--fg);flex:none}
.fol.add{background:var(--fg);color:var(--ink);border-color:var(--fg)}
.cta{display:flex;gap:8px;flex-wrap:wrap;margin-top:2px}
.cta .details-btn{margin-top:0}
.reg-btn{background:var(--accent);color:var(--accent-ink);border-radius:999px;padding:9px 16px;font-weight:700;font-size:14px;text-decoration:none}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.actions .btn{text-decoration:none;color:var(--fg)}
.actions .btn.primary{color:var(--accent-ink)}
.orghead{display:flex;gap:14px;align-items:center}
.biglogo{width:64px;height:64px;border-radius:16px;background:#fff;object-fit:contain;flex:none}
.row.orgrow{grid-template-columns:minmax(0,1fr) auto;padding:8px 10px}
.orglink{display:flex;align-items:center;gap:10px;background:none;border:0;padding:0;color:var(--fg);text-align:left;min-width:0}
.orglink span{display:flex;flex-direction:column;min-width:0}
.orglink b{font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.orglink small{color:var(--mute);font-size:12px}
.orglink .logo{width:34px;height:34px}
.logo.ph,.biglogo.ph{display:grid;place-items:center;background:var(--panel2);color:var(--accent);font:800 15px/1 var(--display);border:1px solid var(--line)}
.biglogo.ph{font-size:26px}
.sheet.full .search{margin:0}
.rail{gap:10px}
.codebox{font:700 24px/1 var(--mono);letter-spacing:10px;text-align:center}
.acct{display:flex;justify-content:space-between;align-items:center;gap:12px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px;margin:4px 0 14px}
.acct span{display:flex;flex-direction:column;gap:3px;min-width:0}
.acct small{color:var(--mute);font-size:12.5px}
.clist{display:flex;flex-direction:column;gap:10px;margin-bottom:10px}
.cm{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:8px 10px}
.cm small{color:var(--mute);font-size:11.5px}
.cm p{margin:4px 0 0;font-size:14px;white-space:pre-wrap;word-break:break-word}
.cform{display:flex;flex-direction:column;gap:8px;margin-top:6px}
.cform textarea{resize:vertical;font:inherit}
.rb.liked .ic{background:#ff4d6d;border-color:#ff4d6d;color:#fff}
/* OLX-style full-screen filters */
.sheet.full{max-height:100%;height:100%;border-radius:0;border-top:0;padding:0;background:var(--ink);display:flex;flex-direction:column}
.fhead{position:sticky;top:0;z-index:2;display:flex;align-items:center;gap:6px;padding:10px max(12px,env(safe-area-inset-right,0px)) 10px max(8px,env(safe-area-inset-left,0px));background:var(--ink);border-bottom:1px solid var(--line)}
.fhead b{font:800 19px/1 var(--display)}
.fback{font-size:30px;line-height:1;background:none;border:0;color:var(--fg);width:36px;height:36px;padding:0}
.flink{margin-left:auto;background:none;border:0;color:var(--accent);font-weight:700;font-size:14px}
.frow,.fopt{display:flex;justify-content:space-between;align-items:center;gap:12px;width:100%;padding:14px max(16px,env(safe-area-inset-right,0px)) 14px max(16px,env(safe-area-inset-left,0px));background:none;border:0;border-bottom:1px solid var(--line);text-align:left;color:var(--fg);box-sizing:border-box}
.frow span,.fopt span{display:flex;flex-direction:column;gap:3px;min-width:0}
.frow b{font-size:15px}
.frow small,.fopt small{color:var(--mute);font-size:13px;overflow:hidden;text-overflow:ellipsis}
.frow em{font-style:normal;color:var(--accent);font-weight:700;font-size:13px;flex:none}
.frow.static{flex-direction:column;align-items:stretch;gap:10px}
.minmax{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.fopt{font-size:15px}
.fopt i{font-style:normal;color:var(--accent);font-weight:800;width:18px;text-align:right}
.fopt.on{color:var(--accent)}
.flabel{padding:16px 16px 6px;font:500 11px/1 var(--mono);letter-spacing:.09em;text-transform:uppercase;color:var(--mute)}
.frowpad{padding:12px 16px}
.ffoot{position:sticky;bottom:0;margin-top:auto;padding:12px max(16px,env(safe-area-inset-right,0px)) calc(12px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));background:var(--ink);border-top:1px solid var(--line)}
.fsee{width:100%;padding:13px;font-size:15px}
.endcard{display:grid;place-items:center;text-align:center;padding:32px}
.endcard h2{font:800 22px/1.15 var(--display);margin:0 0 8px}
.endcard p{color:var(--mute);max-width:30ch;margin:0 auto 14px}

/* Tab bar */
nav.tabs{display:grid;grid-template-columns:repeat(5,1fr);border-top:1px solid var(--line);background:var(--ink);padding-bottom:env(safe-area-inset-bottom,0px)}
.tab{background:none;border:0;padding:8px 0 9px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;color:var(--mute)}
.tab svg{width:22px;height:22px}
.tab.on{color:var(--fg)}
.tab.add .plus{width:42px;height:28px;border-radius:8px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center}

/* Sheet */
.backdrop{position:absolute;inset:0;background:rgba(0,0,0,.55);z-index:20;opacity:0;pointer-events:none;transition:opacity .2s}
.backdrop.on{opacity:1;pointer-events:auto}
.sheet{position:absolute;left:0;right:0;bottom:0;max-height:90%;z-index:21;background:var(--panel);border-radius:18px 18px 0 0;border-top:1px solid var(--line);transform:translateY(102%);transition:transform .25s ease;overflow-y:auto;padding:10px max(16px,env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.sheet.on{transform:none}
.grip{width:40px;height:4px;border-radius:2px;background:var(--line);margin:0 auto 12px}
.sheet h2{font:800 22px/1.12 var(--display);margin:6px 0 4px;text-wrap:balance}
.sec{margin-top:18px}
.sec h3{font:500 11px/1 var(--mono);letter-spacing:.09em;text-transform:uppercase;color:var(--mute);margin:0 0 8px}
.kv{display:grid;grid-template-columns:minmax(92px,auto) 1fr;gap:7px 12px;font-size:14px}
.kv dt{color:var(--mute)}
.kv dd{margin:0;min-width:0}
.money{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.mrow{display:grid;grid-template-columns:1fr auto;gap:10px;padding:9px 11px;font-size:14px;border-top:1px solid var(--line);align-items:center}
.mrow:first-child{border-top:0}
.mrow .v{color:var(--mute);font-size:13px;grid-column:1/-1;margin-top:-4px}
.st{font:500 10.5px/1 var(--mono);text-transform:uppercase;letter-spacing:.05em;padding:4px 6px;border-radius:4px;white-space:nowrap}
.st.yes{background:rgba(79,209,139,.15);color:var(--ok)}
.st.partial{background:rgba(255,181,71,.15);color:var(--warn)}
.st.no{background:rgba(255,107,107,.15);color:var(--bad)}
.st.ns{background:var(--panel2);color:var(--mute)}
.st.info{background:rgba(127,180,255,.14);color:var(--info)}
ul.el{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:5px;font-size:14px}
ol.steps{margin:0;padding:0;list-style:none;counter-reset:s;display:flex;flex-direction:column;gap:9px}
ol.steps li{counter-increment:s;display:grid;grid-template-columns:26px 1fr;gap:8px;font-size:14px}
ol.steps li::before{content:counter(s);width:24px;height:24px;border-radius:50%;background:var(--accent);color:var(--accent-ink);font:700 12px/24px var(--mono);text-align:center}
.contact{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:9px 11px;border:1px solid var(--line);border-radius:10px;font-size:14px}
.contact + .contact{margin-top:6px}
.contact code{font-family:var(--mono);font-size:13px;user-select:all;word-break:break-all}
.contact small{display:block;color:var(--mute);font-size:12px}
.btn{border:1px solid var(--line);background:var(--panel2);border-radius:999px;padding:8px 14px;font-weight:600;font-size:13.5px}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btnrow{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
a.btn{text-decoration:none;display:inline-block;color:inherit}
a.btn.primary{color:var(--accent-ink)}
.note{font-size:12.5px;color:var(--mute);line-height:1.45}
.warnbox{border:1px solid rgba(255,181,71,.45);background:rgba(255,181,71,.08);border-radius:10px;padding:10px 12px;font-size:13px;color:var(--fg)}

/* Lists */
.h1{font:800 26px/1.1 var(--display);margin:4px 0 4px}
.sub{color:var(--mute);font-size:13.5px;margin:0 0 14px}
.search{width:100%;box-sizing:border-box;background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:11px 13px}
.filters{display:flex;gap:6px;overflow-x:auto;padding:10px 0 4px;scrollbar-width:none}
.fchip{flex:none;background:var(--panel2);border:1px solid var(--line);border-radius:999px;padding:6px 11px;font-size:13px;font-weight:600;color:var(--mute)}
.fchip.on{background:var(--fg);color:var(--ink);border-color:var(--fg)}
.list{display:flex;flex-direction:column;gap:8px;margin-top:10px}
.row{display:grid;grid-template-columns:58px 1fr auto;gap:12px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:8px;text-align:left;width:100%}
.thumb{width:58px;height:58px;border-radius:8px;overflow:hidden}
.thumb svg{width:100%;height:100%;display:block}
.row .t{font-weight:700;font-size:14.5px;line-height:1.25;min-width:0}
.row .m{color:var(--mute);font-size:12.5px;margin-top:3px}
.dl{font:500 12px/1.2 var(--mono);text-align:right;white-space:nowrap}
.dl.soon{color:var(--accent)}
.empty{color:var(--mute);text-align:center;padding:28px 10px;border:1px dashed var(--line);border-radius:12px;margin-top:12px}
.group{margin-top:18px}
.group h3{font:500 11px/1 var(--mono);letter-spacing:.09em;text-transform:uppercase;color:var(--mute);margin:0}

/* Profile + add */
.field{display:flex;flex-direction:column;gap:6px;margin-top:14px}
.field label,.lbl{font-weight:600;font-size:14px}
.toggle{display:flex;justify-content:space-between;align-items:center;gap:14px;padding:12px 0;border-bottom:1px solid var(--line)}
.toggle span small{display:block;color:var(--mute);font-size:12.5px;font-weight:400;margin-top:2px}
.sw{appearance:none;width:44px;height:26px;border-radius:13px;background:var(--line);position:relative;flex:none;cursor:pointer;transition:background .15s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:var(--fg);transition:transform .15s}
.sw:checked{background:var(--accent)}
.sw:checked::after{transform:translateX(18px);background:var(--accent-ink)}
select,.inp{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%;box-sizing:border-box}
.ichips{display:flex;flex-wrap:wrap;gap:6px}
.drop{border:1.5px dashed var(--line);border-radius:14px;padding:22px 14px;text-align:center;color:var(--mute);display:block;cursor:pointer}
.drop strong{color:var(--fg);display:block;margin-bottom:4px}
.preview{margin-top:12px;border-radius:12px;overflow:hidden;max-height:260px;display:flex;justify-content:center;background:var(--panel2)}
.preview img{max-height:260px;object-fit:contain}
.flow{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:14px 0 4px}
.flow div{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:9px;font-size:12px;color:var(--mute)}
.flow b{display:block;color:var(--fg);font-size:13px;margin-bottom:2px}

.toast{position:absolute;left:50%;bottom:76px;transform:translate(-50%,20px);background:var(--fg);color:var(--ink);padding:10px 14px;border-radius:10px;font-weight:600;font-size:13.5px;z-index:40;opacity:0;pointer-events:none;transition:all .2s;display:flex;gap:12px;align-items:center;max-width:88%}
.toast.on{opacity:1;transform:translate(-50%,0);pointer-events:auto}
.toast button{background:none;border:0;font-weight:800;color:var(--ink);text-decoration:underline;padding:0}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}

   <div id="si-step1"><div class="field"><label for="si-email">Email</label><input id="si-email" class="inp" type="email" inputmode="email" autocomplete="email" placeholder="you@example.com"></div>

// A sign-in link that failed (expired, already used) says so instead of failing silently.
{const h=new URLSearchParams(location.hash.slice(1));
 if(h.get("error_description")){setTimeout(()=>{openSignIn("use all features");const m=$("#si-msg");if(m)m.innerHTML="⚠️ That sign-in link didn't work ("+escHTML(h.get("error_description"))+"). Request a new one below and open it on this phone, in Chrome."},600);history.replaceState(null,"",location.pathname)}}

/* ---------- language: English / العربية ---------- */
// Arabic swaps every piece of on-screen English for its Arabic from one dictionary (ar.json):
// app labels and the details of each opportunity. Event titles and organisation names are
// marked "nt" and are never translated. Numbers in labels ("8 days left") use patterns below.
let LANG="en",AR={};
try{LANG=JSON.parse(localStorage.getItem("darb-state")||"{}").lang||"en"}catch(e){}
const AR_MONTHS={Jan:"كانون الثاني",Feb:"شباط",Mar:"آذار",Apr:"نيسان",May:"أيار",Jun:"حزيران",Jul:"تموز",Aug:"آب",Sep:"أيلول",Sept:"أيلول",Oct:"تشرين الأول",Nov:"تشرين الثاني",Dec:"كانون الأول",January:"كانون الثاني",February:"شباط",March:"آذار",April:"نيسان",June:"حزيران",July:"تموز",August:"آب",September:"أيلول",October:"تشرين الأول",November:"تشرين الثاني",December:"كانون الأول"};
const arDate=s=>s.replace(/\b(January|February|March|April|June|July|August|September|October|November|December|Jan|Feb|Mar|Apr|May|Jun|Jul|Aug|Sept|Sep|Oct|Nov|Dec)\b/g,m=>AR_MONTHS[m]);
const DATE_RE="(\\d{1,2} [A-Z][a-z]{2,8} \\d{4})";
const AR_PATTERNS=[
  [/^(\d+) days left$/,(m,n)=>`باقي ${n} أيام`],[/^1 day left$/,()=>"باقي يوم واحد"],
  [/^Starts in (\d+) days$/,(m,n)=>`يبدأ بعد ${n} أيام`],[/^Ended (.+)$/,(m,d)=>`انتهى ${arDate(d)}`],
  [/^See (\d+) results?$/,(m,n)=>`عرض ${n} نتيجة`],[/^(\d+) open$/,(m,n)=>`${n} متاح`],
  [/^(\d+) chosen$/,(m,n)=>`${n} مختار`],[/^Showing (\d+) of (\d+)\. Search to narrow down\.$/,(m,a,b)=>`عرض ${a} من ${b}. ابحث لتضييق النتائج.`],
  [/^Uploading (\d+)\/(\d+)…$/,(m,a,b)=>`جارٍ الرفع ${a}/${b}…`],[/^Browse all (\d+) organisers$/,(m,n)=>`تصفّح كل المنظِّمين (${n})`],
  [/^(\d+) open opportunit(y|ies) on Darb$/,(m,n)=>`${n} فرصة متاحة على Darb`],[/^All · (\d+)$/,(m,n)=>`الكل · ${n}`],
  [/^That's all (\d+) for your filters$/,(m,n)=>`هذه كل النتائج (${n}) حسب الفلاتر`],[/^(\d+) views?$/,(m,n)=>`${n} مشاهدة`],
  [/^Refreshed · (\d+) open · updated (.+)$/,(m,n,d)=>`تم التحديث · ${n} متاح · آخر تحديث ${arDate(d)}`],
  [new RegExp("^"+DATE_RE+"$"),(m,d)=>arDate(d)],[new RegExp("^Register by "+DATE_RE+"$"),(m,d)=>`التسجيل قبل ${arDate(d)}`],
  [/^Before (.+)$/,(m,d)=>`قبل ${arDate(d)}`],[/^After (.+)$/,(m,d)=>`بعد ${arDate(d)}`],
];
const EMOJI_LEAD=/^((?:\p{Extended_Pictographic}|\p{Regional_Indicator})[️‍\p{Extended_Pictographic}\p{Regional_Indicator}]*\s*)([\s\S]*)$/u;
function trCore(s){
  if(AR[s])return AR[s];
  const e=s.match(EMOJI_LEAD);if(e&&e[2]&&AR[e[2]])return e[1]+AR[e[2]];
  for(const[re,fn]of AR_PATTERNS){const m=s.match(re);if(m)return fn(...m)}
  // "Label · value · value": translate the parts we know.
  if(s.includes(" · ")){const parts=s.split(" · ");let hit=0;const out=parts.map(p=>{const r=p.trim()&&trCore(p.trim());if(r){hit++;return r}return p});if(hit)return out.join(" · ")}
  return null;
}
function trText(s){
  const m=s.match(/^([\s·•|–:,(“"]*)([\s\S]*?)([\s·•|.:,)”"…]*)$/);if(!m||!m[2]||!/[A-Za-z]/.test(m[2]))return null;
  const r=trCore(m[2]);if(r)return m[1]+r+m[3];
  const r2=m[3].trim()&&trCore(m[2]+m[3].trim());return r2?m[1]+r2:null;
}
function translateTree(root){
  if(LANG!=="ar"||!root)return;
  const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT,{acceptNode:n=>{const p=n.parentElement;if(!p||/^(SCRIPT|STYLE|TEXTAREA|CODE)$/.test(p.tagName)||p.closest(".nt,[translate=no]"))return NodeFilter.FILTER_REJECT;return NodeFilter.FILTER_ACCEPT}});
  for(let n;(n=w.nextNode());){if(n._en===undefined)n._en=n.nodeValue;const r=trText(n._en);if(r&&n.nodeValue!==r)n.nodeValue=r}
  const els=root.querySelectorAll?root.querySelectorAll("[placeholder],[aria-label],[title]"):[];
  for(const el of els)for(const a of ["placeholder","aria-label","title"]){const v=el.getAttribute(a);if(!v)continue;const k="data-en-"+a;const en=el.getAttribute(k)||v;if(!el.hasAttribute(k))el.setAttribute(k,v);const r=trText(en);if(r&&v!==r)el.setAttribute(a,r)}
}
const t=x=>LANG==="ar"&&trCore(x)||x;
async function loadLang(){
  if(LANG!=="ar")return;
  document.documentElement.lang="ar";document.documentElement.dir="rtl";
  try{const r=await fetch("i18n-ar.json?v="+(UPDATED||Date.now()));if(r.ok)AR=await r.json()}catch(e){}
  translateTree(document.body);
  new MutationObserver(ms=>{for(const m of ms)for(const n of m.addedNodes){if(n.nodeType===1)translateTree(n);else if(n.nodeType===3&&n.parentElement)translateTree(n.parentElement)}}).observe(document.body,{childList:true,subtree:true});
}
function setLang(l){S.lang=l;persist();location.reload()}

/* ---------- helpers ---------- */
const $=s=>document.querySelector(s);
const byId=id=>OPPS.find(o=>o.id===id);
const DAY=864e5;
function daysLeft(o){const t=o.deadline||o.eventDate;if(!t)return null;return Math.ceil((new Date(t)-Date.now())/DAY)}
// Seasonal places (ski resorts, beaches) appear only once their owners announce the season:
// the daily update sets seasonOpen:true (with the announced dates and prices) and false when they close.
const seasonHidden=o=>!!o.season&&!o.seasonOpen;
function isClosed(o){const d=o.deadline?daysLeft(o):(o.eventDate?Math.ceil((new Date(o.eventDate)-Date.now())/DAY)+5:null);return d!==null&&d<0}
function dlLabel(o){
  if(o.visit){if(o.season)return o.seasonOpen?"Open · in season":"Season not announced yet";return"See opening hours"}
  if(isClosed(o)){const e=o.eventEnd||o.eventDate,de=e?Math.ceil((new Date(e)-Date.now())/DAY):null;
    if(de!==null&&de>0)return"Registration closed";if(de!==null&&de>=-1)return"Happening now";return"Ended "+fmtDate(e||o.deadline)}
  if(o.job&&!o.deadline)return"Hiring now";
  if(o.rolling)return"Rolling";
  const d=daysLeft(o);
  if(d===null)return o.sample?"Example":"Deadline TBC";
  if(o.eventDate&&!o.deadline)return d<=0?"Happening now":d===1?"Starts tomorrow":`Starts in ${d} days`;
  if(d<0)return"Closed";if(d===0)return"Closes today";if(d===1)return"1 day left";return`${d} days left`;
}
function fundLabel(o){return{full:["Flights + housing covered","ok"],partial:["Partly funded","warn"],none:["Self-funded travel","bad"],na:[null,null]}[o.funded]}
function eligLabel(o){return{ok:["Appears eligible","ok"],check:["Check eligibility","warn"],no:["Not eligible","bad"]}[o.elig.status]}

// Biggest prize in US dollars, read from the prize text ("$5,000 champion", "€10,000", "₹30,000").
const FX={"$":1,usd:1,"€":1.08,eur:1.08,"£":1.27,gbp:1.27,"₹":.012,inr:.012,chf:1.12,cad:.73,aed:.27,sar:.27,lbp:1/89500,"l.l.":1/89500};
function prizeUSD(o){
  if(o._pz!==undefined)return o._pz;let best=0;const t=(o.prize||"").toLowerCase();
  const num=(n,m)=>parseFloat(n.replace(/,/g,""))*(/^(k|thousand)$/.test(m||"")?1e3:/^(m|million)$/.test(m||"")?1e6:1);
  for(const x of t.matchAll(/(\$|€|£|₹|usd|eur|gbp|inr|chf|cad|aed|sar)\s?(\d[\d,]*(?:\.\d+)?)\s?(k|m|million|thousand)?\b/g))best=Math.max(best,num(x[2],x[3])*FX[x[1]]);
  for(const x of t.matchAll(/(\d[\d,]*(?:\.\d+)?)\s?(k|m|million|thousand)?\s?(usd|eur|gbp|inr|chf|cad|aed|sar|lbp|l\.l\.|dollars?|euros?)\b/g))best=Math.max(best,num(x[1],x[2])*(FX[x[3]]||(/euro/.test(x[3])?1.08:1)));

// Keep variants of the same thing apart (e.g. Sony photo awards' 3 categories, several Murex jobs):
// no repeat of a series within the last 4 cards, and never the same organiser twice in a row.
const seriesKey=o=>orgKey(o)+"|"+o.title.toLowerCase().replace(/[^a-z ]/g," ").split(/\s+/).filter(Boolean).slice(0,2).join(" ");
function spread(list){
  const out=[],pending=list.slice();
  while(pending.length){
    const recent=out.slice(-4).map(seriesKey),prevOrg=out.length?orgKey(out[out.length-1]):null;
    let i=pending.findIndex(o=>!recent.includes(seriesKey(o))&&orgKey(o)!==prevOrg);
    if(i<0)i=pending.findIndex(o=>!recent.includes(seriesKey(o)));

}

const TYPES={competition:"🏆 Competitions",class:"📚 Classes & training",event:"🎤 Events & conferences",trip:"🥾 Trips & outings",aid:"💰 Scholarships & financial aid",program:"🎓 Programmes & scholarships",intern:"🧑‍💻 Internships",job:"💼 Jobs",club:"👥 Clubs & communities",volunteer:"🤝 Volunteering",place:"🏛️ Places to visit",festival:"🎉 Festivals & celebrations",show:"🎬 Shows, movies & concerts",exam:"📝 Exams & admissions",admission:"🎓 University admissions"};

const DEGREES={bachelor:"Bachelor's",master:"Master's",phd:"PhD"};
function degreeOf(o){
  if(o.degree)return o.degree;
  const t=o.title+" "+eligLine(o,"level:");
  if(/\bph.?d|doctora/i.test(o.title))return"phd";
  if(/master|\bmsc\b|\bma\b|\bmba\b|graduate program/i.test(o.title))return"master";

function typesOf(o){
  if(o._types)return o._types;
  const t=new Set(),x=o.title+" "+(o.when||"");
  if(o.cat==="hackathon"||o.cat==="case"||/compet|contest|challenge|championship|tournament|\bcup\b|olympiad|hackathon|\bctf\b|prize|award|\bopen\b|league|race|marathon|\b\d+k\b|run\b|regatta|grand prix|series|rally|aquathlon|triathlon|duathlon|pitch/i.test(x))t.add("competition");

  if(/class|course|workshop|training|lesson|bootcamp|academy|tutorial|masterclass|clinic|summer school|winter school|\bschool\b|study jam/i.test(o.title)&&!/scholarship|master'?s|fellowship|degree|\bphd\b|erasmus mundus/i.test(o.title))t.add("class");
  if(/conference|summit|forum|festival|exhibition|talk|screening|concert|meetup|\bfair\b|week\b|webinar|symposium|congress|\bday\b|\bmun\b|model united|gala|launch/i.test(x))t.add("event");
  if(o.cat==="hiking"||/hike|hiking|trek|\btour\b|trip|excursion|outing|atv|paraglid|ski day/i.test(x))t.add("trip");
  if(o.cat==="research"||o.cat==="exchange"||/scholarship|fellowship|exchange|internship|residency|accelerator|incubat|programme|program\b|erasmus|grant/i.test(x))t.add("program");
  if(o.cat==="career"&&/engineer|analyst|job|position|graduate|intern|hiring|vacanc|referent|officer|role/i.test(x)||/\bjob\b|vacanc/i.test(x))t.add("job");
  if(o.source==="bulk-aid"||/scholarship|financial aid|bursar|tuition|stipend|\bgrant|student loan|fee waiver|fellowship/i.test(o.title))t.add("aid");
  if(o.source==="bulk-internships"||/\bintern(ship)?s?\b|traineeship|summer analyst|co-?op\b/i.test(o.title))t.add("intern");
  if(o.job)t.add(o.intern?"intern":"job");
  if(o.exam||/\b(sat|act|gre|gmat|mcat|lsat|toefl|ielts|delf|dalf|cfa|acca|pmp)\b|entrance exam|admission|application deadline/i.test(o.title))t.add("exam");
  if(o.admission)t.add("admission");
  if(o.visit)t.add("place");
  if(o.class)t.add("class");
  if(o.show||o.movie||/circus|concert|theat(re|er) play|stand-?up|comedy night|musical|screening|premiere|now showing/i.test(o.title))t.add("show");
  if(o.festival||/festival|mahrajan|christmas (village|market)|\beid\b|feast|carnival/i.test(o.title))t.add("festival");

// After the filtered results run out, keep going with the closest matches (like OLX's "more results").
function moreLikeThis(shown){
  const ids=new Set(shown.map(o=>o.id)),tp=S.profile.topics||[],f=S.filters;
  const pool=OPPS.filter(o=>!ids.has(o.id)&&!isClosed(o)&&!S.hidden.includes(o.id)&&o.elig.status!=="no"&&!reachReason(o));
  const fam=new Set(tp.flatMap(k=>FAMILY[k]||[]));
  const near=o=>{
    let s=0;for(const k of tp)if(topicsOf(o).has(k))s+=30;
    if([...topicsOf(o)].some(t=>fam.has(t)))s+=20;
    for(const t of f.types||[])if(typesOf(o).has(t))s+=12;
    if(f.region&&regionOf(o)===f.region)s+=15;

/* ---------- watch tracking for For You (time on each card, skips) ---------- */
let io,curView=null,curStart=0;
function endView(){
  if(!curView)return;const o=byId(curView),ms=Date.now()-curStart;
  if(o){if(ms>1500)track("view",curView);S.seen[curView]=(S.seen[curView]||0)+1;if(ms>5000)bump(o,1);else if(ms<1500)bump(o,-.3);persist()}
  curView=null;
}
function observeViews(){
  if(io)io.disconnect();if(!("IntersectionObserver"in window))return;
  io=new IntersectionObserver(es=>{for(const e of es){
    // Videos play only while their card is on screen.
    const v=e.target.querySelector("video");if(v){if(e.isIntersecting&&e.intersectionRatio>=.6)v.play().catch(()=>{});else v.pause()}
    if(e.isIntersecting&&e.intersectionRatio>=.6&&e.target.dataset.id!==curView){endView();curView=e.target.dataset.id;curStart=Date.now()}}},{root:$("#v-feed"),threshold:[0,.6]});
  document.querySelectorAll(".slide[data-id]").forEach(s=>io.observe(s));
}

/* ---------- register directly: website, email, WhatsApp, call ---------- */
function contactLinks(o){
  const msg=encodeURIComponent(`Hi, I'd like to register for "${o.title}" (found on Darb).`),out=[];
  for(const[type,val]of o.contact||[]){
    const v=String(val).trim(),email=v.match(/[\w.+-]+@[\w-]+(\.[\w-]+)+/);
    if(email){out.push(["✉️ Email",`mailto:${email[0]}?subject=${encodeURIComponent("Registration: "+o.title)}&body=${msg}`]);continue}
    const digits=v.replace(/\D/g,"");
    if(/whatsapp|phone|mobile|tel|call|hotline/i.test(type)&&digits.length>=7&&!/x{2}/i.test(v)){
      // Lebanese numbers are often written locally (03 123 456); WhatsApp needs the country code.
      let n=digits;if(/^0/.test(n))n="961"+n.slice(1);else if(n.length<=8)n="961"+n;
      if(/whatsapp|mobile|phone/i.test(type))out.push(["💬 WhatsApp",`https://wa.me/${n}?text=${msg}`]);
      out.push(["📞 Call",`tel:+${n}`]);continue;
    }
    if(!/@|\s/.test(v)&&/^(https?:\/\/)?[\w-]+(\.[\w-]+)+(\/\S*)?$/i.test(v))out.push([`🔗 ${type}`,/^https?:/i.test(v)?v:"https://"+v]);
  }
  return out;
}
function regActions(o){
  const l=contactLinks(o);if(o.url)l.unshift([isClosed(o)?"Event page ↗":o.visit||o.club?"Website ↗":"Register / apply ↗",o.url]);
  if(whereOf(o)==="lebanon"&&o.place&&!/online/i.test(o.place))l.push(["📍 Directions",mapsUrl(orgName(o),o.place)]);
  if(!l.length)return"";
  return`<div class="actions">${l.map(([t,h],i)=>`<a class="btn ${i===0?"primary":""}" href="${esc(h)}" ${/^https?:/.test(h)?'target="_blank" rel="noopener"':""} data-reg="${o.id}">${t}</a>`).join("")}</div>`;
}

/* ---------- clubs & places vs posts (like Google Maps + Eventbrite) ---------- */
// A club or an always-open place (museum, park, kayaking provider…) is a listing: it lives in Search
// and on its organiser's page. Discover shows posts: matches, events, openings, a season starting.
const isListing=o=>!!(o.club||o.visit)&&!(o.season&&o.seasonOpen);
const mapsUrl=(name,place)=>"https://www.google.com/maps/search/?api=1&query="+encodeURIComponent([name,(place||"").split(" (")[0],"Lebanon"].filter(Boolean).join(", "));
// "When it happens" (Discover filter): the event's dates overlap the chosen window.
const HAPPENS={today:"Today",tomorrow:"Tomorrow",weekend:"This weekend",week:"Next 7 days"};
function happensIn(o,w){
  if(!o.eventDate)return false;
  const s=new Date(o.eventDate),e=o.eventEnd?new Date(o.eventEnd):new Date(s.getTime()+DAY-1),d0=new Date();d0.setHours(0,0,0,0);
  let a=d0,b;
  if(w==="today")b=new Date(d0.getTime()+DAY);
  else if(w==="tomorrow"){a=new Date(d0.getTime()+DAY);b=new Date(d0.getTime()+2*DAY)}
  else if(w==="weekend"){const dow=d0.getDay(),toSat=(6-dow+7)%7;a=new Date(d0.getTime()+(dow===0?-1:toSat)*DAY);b=new Date(a.getTime()+2*DAY)}
  else b=new Date(d0.getTime()+7*DAY);
  return s<b&&e>=a;
}

let searchMode="all",placeTopic="";
function listingMatches(o,q){
  if(!q)return true;
  const hay=[o.title,o.org,o.place,o.meet||"",o.sport||"",...[...topicsOf(o)].map(k=>(TOPICS.find(t=>t[0]===k)||[,k])[1])].join(" ").toLowerCase();
  return q.split(/\s+/).filter(w=>w&&!/^(clubs?|places?|in|the|and|a)$/.test(w)).every(w=>hay.includes(w.replace(/s$/,"")));
}

/* ---------- filter panel ---------- */
// Laid out like OLX: a full-screen page of rows; each row opens its own list; live count at the bottom.
let filterPage=null;
const WHEN={any:"Any time","7":"Closing in 7 days","30":"Closing in 30 days",rolling:"Apply any time"};
const WHERE={lebanon:"In Lebanon",online:"Online",abroad:"Abroad (travel)"};
const MONEY={full:"Fully funded",partial:"Partly funded",free:"Free to join",prize:"Has a prize"};
const SORTS={best:"Best for me",soon:"Closing soonest",new:"Newest",cheap:"Lowest fee (cheapest club, class or ticket)",prize:"Biggest prize"};
function filterSummary(){
  const f=S.filters,tp=S.profile.topics||[];
  const loc=(f.city?`“${f.city}” · `:"")+(f.region?REGIONS.find(r=>r[0]===f.region)[1]+", Lebanon":f.where.length?f.where.map(w=>WHERE[w]).join(", "):f.city?"":"Everywhere");
  return{
    type:f.types.length?f.types.map(t=>TYPES[t].replace(/^\S+\s/,"")).join(", "):"Everything",
    category:tp.length?tp.map(k=>(TOPICS.find(t=>t[0]===k)||[,k])[1]).join(", "):"All categories",
    location:loc,
    deadline:[f.when!=="any"?WHEN[f.when]:"",f.dlMode&&f.dlDate?`${f.dlMode==="before"?"Before":"After"} ${fmtDate(f.dlDate)}`:""].filter(Boolean).join(" · ")||"Any time",
    money:f.money.length?f.money.map(m=>MONEY[m]).join(", "):"Any",
    more:[f.eligOnly?"Only clearly eligible":"",f.ended===false?"Hiding ended events":"",`Sort: ${SORTS[f.sort]}`].filter(Boolean).join(" · ")
  };
}

/* ---------- saved / deadlines ---------- */
function renderSaved(){
  const sortD=(a,b)=>(daysLeft(a)??9999)-(daysLeft(b)??9999);
  const saved=S.saved.map(byId).filter(o=>o&&!S.applied.includes(o.id)).sort(sortD);
  const applied=S.applied.map(byId).filter(Boolean).sort(sortD);
  const perm=("Notification"in window)?Notification.permission:"unsupported";
  const remind=perm==="granted"?`<p class="note" style="margin:0 0 12px">🔔 Reminders are on: you'll get a notification 7 days and 2 days before each saved deadline.</p>`
    :perm==="denied"?`<p class="note" style="margin:0 0 12px">🔕 Notifications are blocked for Darb. Allow them in your phone's settings to get reminders.</p>`
    :perm==="unsupported"?"":`<button class="btn primary" data-remind="1" style="margin:0 0 12px">🔔 Turn on deadline reminders</button>`;
  $("#v-saved").innerHTML=`<h1 class="h1">Deadlines</h1><p class="sub">Saved items sorted by closing date, soonest first.</p>${remind}
   <div class="group"><h3>Saved · ${saved.length}</h3><div class="list">${saved.length?saved.map(o=>rowHTML(o,isClosed(o)?'<div class="m" style="color:var(--bad)">Closed</div>':"")).join(""):`<div class="empty">Tap Save on any card in Discover and it appears here.</div>`}</div></div>
   <div class="group"><h3>Applied · ${applied.length}</h3><div class="list">${applied.length?applied.map(o=>rowHTML(o,'<div class="m" style="color:var(--ok)">Applied · waiting for a result</div>')).join(""):`<div class="empty">Mark “I applied” to track your applications.</div>`}</div></div>`;
}

/* ---------- deadline reminders ---------- */
// The page keeps a small list of saved deadlines where the background worker can read it,
// so reminders can arrive even when the app is closed (Chrome on Android, installed app).
async function syncReminders(){
  if(!("caches"in window)||!("serviceWorker"in navigator))return;
  try{
    const c=await caches.open("darb-reminders"),old=await c.match("saved.json"),prev=old?await old.json():{};
    const items=S.saved.map(byId).filter(o=>o&&o.deadline&&!isClosed(o)).map(o=>({id:o.id,title:o.title,deadline:o.deadline}));
    await c.put("saved.json",new Response(JSON.stringify({items,sent:prev.sent||[]}),{headers:{"content-type":"application/json"}}));
    if(Notification.permission==="granted"){const r=await navigator.serviceWorker.ready;r.active&&r.active.postMessage("check-deadlines")}
  }catch(e){}
}
async function enableReminders(){
  if(!("Notification"in window))return toast("This browser can't show notifications");
  const p=await Notification.requestPermission();
  if(p!=="granted"){renderSaved();return toast("Notifications not allowed")}
  try{const r=await navigator.serviceWorker.ready;if(r.periodicSync)await r.periodicSync.register("darb-deadlines",{minInterval:12*3600*1000})}catch(e){}
  await syncReminders();renderSaved();
  toast(S.saved.length?"Reminders on for your saved deadlines":"Reminders on. Save something to get reminded");
}

/* ---------- posts: people publish their own events (photos, flyers, a video + a details form) ---------- */
// A post belongs to the account that made it; only that account can edit it. New posts and edits
// wait for a check (twice a day) and the live version stays up meanwhile, so nobody can swap in spam.
const PUB=SUPA.url+"/storage/v1/object/public/posts/";
const POST_TYPES={
  competition:["🏆 Competition or tournament","community"],class:["📚 Class, course or training","community"],
  club:["👥 Club, team or community","community"],event:["🎤 Event, talk or conference","community"],
  festival:["🎉 Festival or celebration","community"],religious:["⛪ Church or religious community event","community"],
  trip:["🥾 Trip, hike or outing","hiking"],show:["🎬 Show, concert or movie","community"],
  volunteer:["🤝 Volunteering","volunteer"],job:["💼 Job or internship","career"],
  place:["🏛️ Place, offer or opening hours","community"],other:["✨ Something else","community"]};
// Extra questions for each type, on top of the common ones.
const TYPE_FIELDS={
  competition:[["prize","Prizes","e.g. $1,000 first, $500 second"],["team","Team size","e.g. Solo or teams of 2–4"],["format","Format & rules","e.g. Knockout, 3 rounds"]],
  class:[["freq","How often","e.g. 2 sessions a week"],["schedule","Days & times","e.g. Tue & Thu 6–8 PM"],["level","Level","e.g. Beginners welcome"],["ages","Ages","e.g. 16+"]],
  club:[["freq","Training per week","e.g. 3 times a week"],["schedule","Days & times","e.g. Mon, Wed, Fri 5–7 PM"],["season","Competition season","e.g. Oct–May, national league"],["competitions","Competitions you take part in","e.g. Lebanese championship"],["ages","Ages","e.g. 8–18 and adults"]],
  event:[["program","Programme & speakers","e.g. Panels at 10 AM, networking at 1 PM"]],
  festival:[["program","Programme & highlights","e.g. Concerts every night, food stalls"]],
  religious:[["program","Programme","e.g. Mass at 6 PM, procession at 7 PM"],["community","Community / church / mosque","e.g. Maronite parish of Saint Elias"]],
  trip:[["meet","Meeting point & time","e.g. Dora 6:30 AM"],["difficulty","Difficulty","e.g. Moderate, 12 km"],["bring","What to bring","e.g. Water, snacks, good shoes"],["includes","Fee includes","e.g. Bus and guide"]],
  show:[["program","Showtimes","e.g. Fri & Sat 8:30 PM"]],
  volunteer:[["commitment","Time commitment","e.g. 4 hours a week for 2 months"]],
  job:[["pay","Pay","e.g. $800 a month"],["hours","Hours","e.g. Full time, hybrid"],["requirements","Requirements","e.g. Engineering student, English"]],
  place:[["hours","Opening hours","e.g. Tue–Sun 10 AM–6 PM"],["offers","Offers","e.g. Free entry on Sundays for students"]],
  other:[]};
let MYPOSTS=new Map(),MYCLAIMS={},LIVEPOSTS=[];
const myClaim=id=>MYCLAIMS[id];

function postToOpp(r){
  const d={...(r.data||{})},og=LIVEORGS[d.org_id];
  if(og){d.org=og.name;for(const k of ["whatsapp","email","instagram"])if(!d[k])d[k]=k==="whatsapp"?og.phone:og[k]}
  const m=d.media||[],imgs=m.filter(x=>x.kind==="image").map(x=>PUB+x.path),vid=m.find(x=>x.kind==="video");
  const fee=d.fee===""||d.fee==null||isNaN(Number(d.fee))?null:Number(d.fee),where=d.where||"lebanon";
  const contact=[];
  if(d.whatsapp)contact.push(["WhatsApp",d.whatsapp,""]);
  if(d.phone)contact.push(["Phone",d.phone,""]);
  if(d.email)contact.push(["Email",d.email,""]);
  if(d.instagram)contact.push(["Instagram","instagram.com/"+d.instagram.replace(/^@|^https?:\/\/(www\.)?instagram\.com\//,""),""]);
  const extra=(TYPE_FIELDS[d.type]||[]).filter(([k])=>d[k]).map(([k,l])=>[l,d[k]]);
  const date=x=>x?fmtDate(x):"";
  return{id:"post-"+r.id,title:d.title||"Untitled",org:d.org||"Community post",cat:(POST_TYPES[d.type]||POST_TYPES.other)[1],
    catLabel:(POST_TYPES[d.type]||POST_TYPES.other)[0].replace(/^\S+\s/,""),desc:d.desc||"",extra,
    place:where==="online"?"Online":d.place||"Lebanon",travel:where==="abroad",
    deadline:d.deadline||null,eventDate:d.start||null,eventEnd:d.end||null,
    deadlineText:d.deadline?"Register by "+date(d.deadline):"Not stated by the organiser",
    when:[d.start?date(d.start)+(d.end&&d.end!==d.start?" – "+date(d.end):""):"",d.time,d.schedule].filter(Boolean).join(" · ")||"See details",
    meet:d.meet||"",team:d.team||"Open",difficulty:d.difficulty||"",bring:d.bring||"",
    feeUSD:fee,feeText:fee===0?"Free":fee!==null?"$"+fee:d.feeNote?"See fee":"Fee not stated",prize:d.prize||"",funded:"na",
    money:[["Fee",fee===0?"Free":fee!==null?"$"+fee:"Not stated",fee===0?"yes":fee!==null?"info":"ns"],...(d.feeNote?[["Details",d.feeNote,"info"]]:[]),...(d.prize?[["Prize",d.prize,"info"]]:[])],
    elig:{status:"ok",lines:[d.who||"Open to everyone (as stated by the organiser)"]},
    steps:(d.steps||"").split(/\n+/).map(x=>x.trim()).filter(Boolean).length?(d.steps||"").split(/\n+/).map(x=>x.trim()).filter(Boolean):[d.link?"Register on the organiser's link":"Contact the organiser below to register"],
    contact,url:/^https?:\/\//.test(d.link||"")?d.link:"",image:imgs[0]||"",gallery:imgs.slice(1),video:vid?PUB+vid.path:"",
    tags:[d.type||"event",...(d.type==="religious"?["religious","faith"]:[])],verified:r.updated_at,confidence:"posted by the organiser",added:r.created_at,
    festival:d.type==="festival",club:d.type==="club",class:d.type==="class",show:d.type==="show",visit:d.type==="place",job:d.type==="job",
    logo:og?orgLogo(og):undefined,post:{id:r.id,mine:MYPOSTS.has(r.id)}};
}
// An approved organiser edit of an event Darb already lists: their details and media win.
function applyEdit(base,r){
  const p=postToOpp(r),d=r.data||{};
  for(const k of ["title","desc","extra","meet","bring","difficulty","prize"])if(d[k]||k==="extra"&&p.extra.length)base[k]=p[k];
  if(p.image){base.image=p.image;base.gallery=p.gallery}
  if(p.video)base.video=p.video;
  if(d.start||d.time){base.when=p.when;if(d.start){base.eventDate=d.start;base.eventEnd=d.end||null}}
  if(d.deadline){base.deadline=d.deadline;base.deadlineText=p.deadlineText}
  if(d.fee!==""&&d.fee!=null||d.feeNote){base.feeUSD=p.feeUSD;base.feeText=p.feeText;base.money=p.money}
  if(d.place)base.place=p.place;
  if(p.contact.length)base.contact=p.contact;
  if(p.url)base.url=p.url;
  base.post={id:r.id,mine:MYPOSTS.has(r.id),edit:true};base.byOrganiser=true;
  delete base._topics;delete base._types;
}
async function loadPosts(){

    LIVEPOSTS=await supa("/rest/v1/rpc/live_posts",{method:"POST",body:"{}"})||[];
    for(const r of LIVEPOSTS){

      if(base)applyEdit(base,r);else if(!r.opp_id&&!byId("post-"+r.id))OPPS.unshift(postToOpp(r));
    }

}

async function sendOrg(){

  if(!d.role)return toast("Add your role there");

  const btn=$("[data-orgsend]");btn.disabled=true;btn.textContent="Saving…";
  try{
    if(orgForm.logoFile){
      const f=orgForm.logoFile,ext=(f.name.split(".").pop()||"png").toLowerCase().replace(/[^a-z0-9]/g,"").slice(0,5);
      const path=`${USER.id}/logo-${Date.now()}.${ext}`;
      const r=await fetch(SUPA.url+"/storage/v1/object/posts/"+path,{method:"POST",headers:{apikey:SUPA.key,authorization:"Bearer "+TOKEN,"content-type":f.type||"image/png"},body:f});
      if(!r.ok)throw new Error("logo");

function readForm(){

function editPost(row,oppId){
  editing={id:row&&row.id||null,opp_id:oppId||(row&&row.opp_id)||null};draft={...((row&&(row.pending||row.data))||{})};

// Claimed event with no edit yet: start from what Darb already shows.
function draftFromOpp(o){
  return{type:o.club?"club":o.class?"class":o.festival?"festival":o.show?"show":o.visit?"place":o.job?"job":typesOf(o).has("competition")?"competition":typesOf(o).has("trip")?"trip":"event",
    title:o.title,org:orgName(o),desc:o.desc||"",start:(o.eventDate||"").slice(0,10),deadline:(o.deadline||"").slice(0,10),place:o.place,
    fee:o.feeUSD??"",feeNote:o.feeText,prize:o.prize||"",link:o.url||"",where:whereOf(o)==="online"?"online":o.travel?"abroad":"lebanon",media:[]};
}
async function sendPost(){
  const d=readForm();
  if(!d.type)return toast("Choose what kind of event it is");
  if(!d.title||d.title.length<3)return toast("Add the event name");
  if(!d.org_id)return toast("Choose who is posting");
  d.org=orgOf(MYORGS.get(d.org_id)||{}).name||d.org||"";
  if(!d.desc)return toast("Describe the event in a few words");
  if(!media.length&&!editing)return toast("Add at least one photo, flyer or video");
  if(d.link&&!/^https?:\/\//.test(d.link))d.link="https://"+d.link;
  const btn=$("[data-postsend]");btn.disabled=true;
  try{
    const out=[];
    for(const[i,m]of media.entries()){
      if(m.path){out.push({path:m.path,kind:m.kind});continue}
      btn.textContent=`Uploading ${i+1}/${media.length}…`;
      const ext=(m.file.name.split(".").pop()||(m.kind==="video"?"mp4":"jpg")).toLowerCase().replace(/[^a-z0-9]/g,"").slice(0,5);
      const path=`${USER.id}/${Date.now()}-${Math.random().toString(36).slice(2,8)}.${ext}`;
      const r=await fetch(SUPA.url+"/storage/v1/object/posts/"+path,{method:"POST",headers:{apikey:SUPA.key,authorization:"Bearer "+TOKEN,"content-type":m.file.type||"application/octet-stream"},body:m.file});
      if(!r.ok)throw new Error(r.status===413?"That file is too big (max 50 MB)":"Upload failed ("+r.status+")");
      out.push({path,kind:m.kind});
    }
    d.media=out;btn.textContent="Saving…";
    await supa("/rest/v1/rpc/save_post",{method:"POST",body:JSON.stringify({p_id:editing&&editing.id||null,p_opp:editing&&editing.opp_id||null,p_data:d})});
    const was=!!editing,wasOpp=editing&&editing.opp_id;editing=null;draft=null;media=[];meTab="posts";await loadMine();
    const live=orgOf(MYORGS.get(d.org_id)||{})&&(MYORGS.get(d.org_id)||{}).status==="live"||!!wasOpp;
    toast(live?(was?"Saved. Your changes are live":"Posted! It's live now"):(was?"Saved. Your changes go live once checked":"Posted! It goes live once your organisation is checked"));
    if(live)loadPosts().then(()=>{_orgs=null});
    show("profile");
  }catch(err){toast(String(err.message||"").startsWith("That file")||/Upload failed/.test(err.message)?err.message:"Couldn't post. Check your connection and try again");btn.disabled=false;btn.textContent=editing?"Save changes":"Post"}
}
function openClaim(id){

  if(st==="approved"){const row=[...MYPOSTS.values()].find(r=>r.opp_id===id);return editPost(row||{opp_id:id,data:draftFromOpp(o)},id)}
  if(st==="pending")return showSheet(`<div class="grip"></div><h2>Claim sent</h2><p class="note">We're checking that you run <b>${escHTML(o.title)}</b>. Once approved, an <b>Edit this event</b> button appears here.</p>`);
  showSheet(`<div class="grip"></div><h2>Do you run this event?</h2>
   <p class="note" style="margin:0 0 12px">Claim <b>${escHTML(o.title)}</b> to update its details and add your own photos, flyers and videos.</p>
   <div class="field"><label for="cl-role">Your role</label><input id="cl-role" class="inp" maxlength="120" placeholder="e.g. Club coach, festival committee member"></div>
   <div class="field"><label for="cl-proof">How can we confirm it's you?</label><textarea id="cl-proof" class="inp" rows="3" maxlength="600" placeholder="e.g. The WhatsApp number on the official flyer is mine, or a link to an official post that names you"></textarea></div>
   <p class="note">Fastest: sign in with an email on the organiser's own domain (like name@aub.edu.lb), or use the phone number, email or Instagram that the official page lists. We check claims twice a day.</p>

async function sendClaim(id){
  const role=($("#cl-role").value||"").trim(),proof=($("#cl-proof").value||"").trim();
  if(!role||!proof)return toast("Add your role and how we can confirm it");
  try{await supa("/rest/v1/claims",{method:"POST",headers:{prefer:"return=minimal"},body:JSON.stringify({opp_id:id,role,proof:proof+" · account: "+(USER.email||"")})});
    MYCLAIMS[id]="pending";closeSheet();toast("Claim sent. We'll check it soon")}
  catch(e){toast(/duplicate|23505/.test(String(e))?"You already claimed this event":"Couldn't send. Check your connection")}
}

/* ---------- comment replies ---------- */
let replyTo=null;   // {id,name} while answering a comment
async function loadComments(id){
  const box=document.querySelector('[data-cfor="'+id+'"]');if(!box)return;
  try{const rows=await supa("/rest/v1/comments?select=id,name,body,created_at,parent_id&opp_id=eq."+encodeURIComponent(id)+"&order=created_at.asc&limit=200");
    const top=rows.filter(c=>!c.parent_id),kids=p=>rows.filter(c=>c.parent_id===p);
    const one=(c,reply)=>`<div class="cm${reply?" reply":""}"><b>${escHTML(c.name||"Someone")}</b> <small>${fmtDate(c.created_at)}</small><p>${escHTML(c.body)}</p>${reply?"":`<button class="clink" data-creply="${c.id}" data-cname="${esc(c.name||"Someone")}">${t("Reply")}</button>`}</div>`;
    box.innerHTML=top.length?top.map(c=>one(c)+kids(c.id).map(r=>one(r,true)).join("")).join(""):`<p class="note">${t("No comments yet. Be the first to ask or share a tip.")}</p>`;
  }catch(e){box.innerHTML=`<p class="note">${t("Comments couldn't load. Check your connection.")}</p>`}

/* ---------- activity: red dot on Me when someone reacts to your posts or replies to you ---------- */
let ACT={n:0,onPosts:[],replies:[]};
async function checkActivity(){
  if(!USER)return setDot(0);
  try{
    const since=S.actSeen||"1970-01-01T00:00:00Z",mine=[...MYPOSTS.values()].filter(r=>r.status==="live").map(r=>r.opp_id||"post-"+r.id);
    const inList=a=>"("+a.map(x=>'"'+String(x).replace(/"/g,"")+'"').join(",")+")";
    const onPosts=mine.length?await supa("/rest/v1/comments?select=id,opp_id,name,body,created_at,user_id,parent_id&opp_id=in."+encodeURIComponent(inList(mine))+"&order=created_at.desc&limit=50"):[];
    const myC=await supa("/rest/v1/comments?select=id&user_id=eq."+USER.id+"&limit=200");
    const replies=myC.length?await supa("/rest/v1/comments?select=id,opp_id,name,body,created_at,user_id,parent_id&parent_id=in."+encodeURIComponent(inList(myC.map(c=>c.id)))+"&order=created_at.desc&limit=50"):[];
    ACT.onPosts=onPosts.filter(c=>c.user_id!==USER.id);ACT.replies=replies.filter(c=>c.user_id!==USER.id);
    const likeNew=mine.reduce((s,id)=>s+Math.max(0,(LIKES[id]||0)-((S.likeSeen||{})[id]||0)),0);
    ACT.n=[...ACT.onPosts,...ACT.replies].filter(c=>c.created_at>since).length+likeNew;
    setDot(ACT.n);
  }catch(e){}
}
function setDot(n){const tab=document.querySelector('.tab[data-v="profile"]');if(tab)tab.classList.toggle("dot",n>0);const chip=document.querySelector('[data-metab="activity"]');if(chip)chip.classList.toggle("dot",n>0)}
function markActivitySeen(){
  S.actSeen=new Date().toISOString();S.likeSeen={};
  for(const r of MYPOSTS.values())if(r.status==="live"){const id=r.opp_id||"post-"+r.id;S.likeSeen[id]=LIKES[id]||0}
  persist();ACT.n=0;setDot(0);
}
setInterval(()=>{if(!document.hidden)checkActivity()},120000);

  if(act==="hide"){closeSheet();S.hidden.push(id);bump(o,-6);persist();const y=$("#v-feed").scrollTop;renderFeed();$("#v-feed").scrollTop=y;toast("Hidden. You'll see fewer like this",()=>{S.hidden=S.hidden.filter(x=>x!==id);persist();renderFeed()})}
});
document.addEventListener("change",e=>{
  const p=S.profile,t=e.target;
  if(t.id==="of-logofile"){const f=t.files[0];if(!f)return;if(f.size>6*1024*1024)return toast("Logo must be under 6 MB");orgForm.data=readOrgForm();orgForm.logoFile=f;orgForm.logoUrl=URL.createObjectURL(f);return renderAdd()}
  if(t.id==="pf-type"){draft=readForm();return renderAdd()}
  if(t.id==="pf-media"){draft=readForm();for(const file of t.files){const kind=/^video/.test(file.type)?"video":"image";
    if(kind==="video"&&media.some(m=>m.kind==="video")){toast("One video per post");continue}
    if(kind==="video"&&file.size>50*1024*1024){toast("That video is over 50 MB. Trim it to about a minute");continue}
    if(kind==="image"&&media.filter(m=>m.kind==="image").length>=8){toast("Up to 8 photos");break}
    media.push({kind,file,url:URL.createObjectURL(file)})}
    t.value="";return drawMedia()}
  if(t.id==="f-elig"){S.filters.eligOnly=t.checked;persist();return openFilters()}
  if(t.id==="f-city"){S.filters.city=t.value.trim();if(S.filters.city&&!S.filters.where.length&&!S.filters.region)S.filters.where=["lebanon"];persist();return openFilters()}
  if(t.id==="f-ended"){S.filters.ended=t.checked;persist();return openFilters()}
  if(t.id==="f-dldate"){S.filters.dlDate=t.value;if(t.value&&!S.filters.dlMode)S.filters.dlMode="before";persist();return openFilters()}
  if(t.id==="f-min"||t.id==="f-max"){
    const v=t.value.trim();if(t.id==="f-min")S.filters.feeMin=v;else S.filters.fee=v===""?"any":v;persist();
    const n=feedItems().length,btn=$(".fsee");if(btn)btn.textContent=`See ${n} result${n===1?"":"s"}`;return;
  }
  if(t.id==="p-travel")p.travel=t.checked;else if(t.id==="p-funded")p.fullyFunded=t.checked;else if(t.id==="p-reach")p.reach=t.checked;else if(t.id==="p-fee")p.maxFee=t.value;else if(t.id==="p-colorful"){p.colorful=t.checked;document.body.classList.toggle("colorful",t.checked)}
  else if(["p-level","p-uni","p-field","p-nat","p-age"].includes(t.id))p[t.id.slice(2)]=t.value;
  else return;
  persist();
  if(t.id==="p-level"&&t.value)toast("Saved. Your feed now hides what you can't join");
});
// Fee boxes update the result count while typing.
document.addEventListener("input",e=>{
  if(e.target.id==="si-code"&&e.target.value.replace(/\D/g,"").length===6)return verifyCode();
  if(e.target.id==="dir-q"){dirQ=e.target.value.toLowerCase();const pos=e.target.selectionStart;openDirectory();const i=$("#dir-q");i.focus();i.setSelectionRange(pos,pos);return}
  if(e.target.id==="f-min"||e.target.id==="f-max")e.target.dispatchEvent(new Event("change",{bubbles:true}))});
$("#backdrop").addEventListener("click",closeSheet);
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeSheet()});
function fmtDate(d){if(!d)return VERIFIED;const x=new Date(d);if(isNaN(x))return d;const s=x.toLocaleDateString("en-GB",{day:"numeric",month:"short",year:"numeric"});return LANG==="ar"?arDate(s):s}
// Opportunities live in opportunities.json, refreshed by the daily updater.
let lastLoad=0;
document.body.classList.toggle("colorful",!!S.profile.colorful);
async function loadData(manual){
  try{
    const r=await fetch("opportunities.json?t="+Date.now(),{cache:"no-store"});if(!r.ok)throw new Error(r.status);
    const d=await r.json(),before=OPPS.length;
    OPPS=d.opportunities||[];UPDATED=d.updated;
    await Promise.race([loadOrgs().then(loadPosts),new Promise(r=>setTimeout(r,4000))]);lastLoad=Date.now();SESSION_SEED=Math.floor(Math.random()*1e9);_orgs=null;
    if(!DIRECTORY.length)try{const x=await fetch("directory.json");if(x.ok)DIRECTORY=(await x.json()).orgs||[]}catch(e){}
    if(!Object.keys(STOCK).length)try{const s=await fetch("stock.json");if(s.ok)STOCK=await s.json()}catch(e){}
    if(current==="feed"||!before){show("feed");$("#v-feed").scrollTop=0}
    syncReminders();loadCounts();
    if(manual)toast(`Refreshed · ${OPPS.filter(o=>!isClosed(o)).length} open · updated ${fmtDate(UPDATED)}`);
    const id=decodeURIComponent(location.hash.slice(1));if(!before&&id&&byId(id))openSheet(id);
  }catch(e){
    if(!OPPS.length)$("#v-feed").innerHTML=`<div class="slide endcard"><div><h2>Couldn't load opportunities</h2><p>Check your connection and try again.</p><button class="btn primary" data-reload="1">Try again</button></div></div>`;
    else if(manual)toast("No connection. Showing what you already have");
  }
}
// Coming back to the app after a while reloads the list and reshuffles the feed.
document.addEventListener("visibilitychange",()=>{if(document.hidden)endView();else if(Date.now()-lastLoad>10*60*1000)loadData()});
// Photo dots follow the swipe position.
document.addEventListener("scroll",e=>{
  const g=e.target.closest&&e.target.closest(".gal");if(!g)return;
  const i=Math.round(g.scrollLeft/g.clientWidth),dots=document.querySelector(`[data-dots="${g.dataset.gal}"]`);
  if(dots)[...dots.children].forEach((d,k)=>d.classList.toggle("on",k===i));
},true);
loadLang();loadData();
</script>
